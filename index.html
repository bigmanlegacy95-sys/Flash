<!-- frontend/checkout.html -->
<script src="https://js.stripe.com/v3/"></script>
<form id="payment-form">
  <div id="card-element"></div>
  <button id="submit-btn" disabled>Pay ${{ amount }}</button>
  <div id="error-message" role="alert"></div>
</form>

<script>
const stripe = Stripe('pk_live_YOUR_PUBLISHABLE_KEY');
const elements = stripe.elements();
const card = elements.create('card', {style: {base: {fontSize: '16px'}}});
card.mount('#card-element');

card.on('change', e => {
  document.getElementById('submit-btn').disabled = !e.complete;
  document.getElementById('error-message').textContent = e.error?.message || '';
});

document.getElementById('payment-form').addEventListener('submit', async e => {
  e.preventDefault();
  const {error, paymentMethod} = await stripe.createPaymentMethod('card', card);
  if (error) return showError(error.message);

  const res = await fetch('/api/payment-intent', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({amount: 5000, currency: 'usd', payment_method_id: paymentMethod.id})
  });
  const data = await res.json();
  if (data.clien Handle next_action (3DS redirect) or success
  } else {
    showError(data.error);
  }
});
</script>
